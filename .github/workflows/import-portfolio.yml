name: Import portfolio bundle

on:
  push:
    paths:
      - '.github/workflows/import-portfolio.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify bundle
        shell: bash
        run: |
          cat .upload_parts/part_* > /tmp/missing_bundle.b64
          base64 -d /tmp/missing_bundle.b64 > /tmp/missing_bundle.zip
          echo "b409465c3bc53c2ff3a11f9012d3911526acb700d00195780e31697511290d95  /tmp/missing_bundle.zip" | sha256sum -c -

      - name: Extract project files
        shell: bash
        run: |
          rm -rf /tmp/portfolio_bundle
          mkdir -p /tmp/portfolio_bundle
          unzip -oq /tmp/missing_bundle.zip -d /tmp/portfolio_bundle
          cp -a /tmp/portfolio_bundle/. .
          mkdir -p uploads/projects
          cp -f assets/projects/*.png uploads/projects/
          rm -rf .upload_parts

      - name: Commit imported files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Complete portfolio project upload [skip ci]"
            git push
          fi
